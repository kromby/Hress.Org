name: Notification Functions CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - ".github/workflows/notification-functions.yml"

concurrency:
  group: notification-functions-deploy
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build, test and deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        # Excludes the 7 known failing tests (external translation service, one broken movie test).
        run: dotnet test api/Ez.Hress.FunctionsApi.sln --filter "FullyQualifiedName!~TranslationServiceIntegrationTests&FullyQualifiedName!~MovieInteractorTests.SaveMovieInformation_ShouldSaveMovieInformation_Async"

      - name: Publish
        run: dotnet publish api/Ez.Hress.NotificationFunctions --configuration Release --output ./publish

      - name: Deploy
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.NOTIFICATION_FUNCTIONS_APP_NAME }}
          package: ./publish
          publish-profile: ${{ secrets.NOTIFICATION_FUNCTIONS_PUBLISH_PROFILE }}
